# Managed by site-deploy host-converge — edits on the box are overwritten each tick.
# Drop-in over the distro's caddy.service.
#
# WHY. One night the kernel's *global* OOM killer chose the proxy (gigabytes of
# anonymous RSS on a box with no swap) during a scraper flood. The stock unit
# carries no Restart=, so `failed (oom-kill)` was terminal: the origin served
# nothing for five days while the edge returned 521 and a handful of cached
# pages made the site look alive. The app was healthy the entire time. Two
# independent bugs, two fixes here.

[Unit]
# systemd's default (5 starts / 10s, then give up permanently) is the wrong
# policy for the process that IS the site. Under a flood that trips MemoryMax
# repeatedly it must keep coming back, however often, forever.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5s

# Make an overload kill LOCAL and recoverable instead of global and terminal.
# The proxy's footprint scales with in-flight requests, so a flood inflates it;
# with a cgroup ceiling the kernel kills only Caddy, Restart=always brings it
# back in 5s, and the app and database never enter the OOM victim lottery.
# MemoryHigh throttles first as a warning band; MemoryMax is the hard stop.
# Steady state for a proxy is tens of MB, so both are enormous headroom — a
# backstop for pathology, not a capacity limit. Sized from
# /etc/site-deploy/host.env (CADDY_MEMORY_HIGH / CADDY_MEMORY_MAX).
MemoryAccounting=yes
MemoryHigh=__MEMORY_HIGH__
MemoryMax=__MEMORY_MAX__
