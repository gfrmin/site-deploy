name: tests

# This toolkit self-updates onto every box from origin/master, so a break here
# reaches production on the next 2-minute tick with nothing in between. The
# suite needs no network, no root and no credentials, and takes seconds.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The boxes parse deploy/site.toml with tomllib, which is stdlib from
      # 3.11. Pin the floor rather than whatever the runner happens to ship.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: shellcheck
        run: shellcheck -S warning bin/*.sh host/*.sh lib/*.sh tests/*.sh

      - name: scenario tests
        run: |
          ./tests/test-auto-deploy.sh
          ./tests/test-self-update.sh
          ./tests/test-hc.sh
          ./tests/test-env-check.sh
          ./tests/test-checks-armed.sh
          ./tests/test-host-converge.sh
          ./tests/test-ufw-cloudflare-sync.sh
          ./tests/test-cf-converge.sh
          ./tests/test-cf-converge-run.sh

  # Advance `ci-green` to this commit once the suite is green on master. The
  # boxes track that ref (bin/self-update.sh), so a red run here means the
  # toolkit simply stops updating rather than shipping a broken poller to every
  # box in two minutes. No `paths:` filter on the trigger, ever: it would skip
  # the run that advances the ref and stall every box silently.
  green:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is load-bearing: a depth-1 clone holds the tip and no
      # history, so git cannot prove the push to ci-green is a fast-forward and
      # the server rejects it with "(fetch first)".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Point ci-green at this commit
        run: git push origin HEAD:refs/heads/ci-green
