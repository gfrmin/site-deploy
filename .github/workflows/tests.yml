name: tests

# This toolkit self-updates onto every box from origin/master, so a break here
# reaches production on the next 2-minute tick with nothing in between. The
# suite needs no network, no root and no credentials, and takes seconds.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The boxes parse deploy/site.toml with tomllib, which is stdlib from
      # 3.11. Pin the floor rather than whatever the runner happens to ship.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: shellcheck
        run: shellcheck -S warning bin/*.sh host/*.sh tests/*.sh

      - name: scenario tests
        run: ./tests/test-auto-deploy.sh
